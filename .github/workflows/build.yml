name: TRLC Extension Build

on:
  # push/pull_request to main deliberately omitted: ci.yml already gates
  # every push/PR (lint + python-test + ts-test + e2e-test + verify-version)
  # - duplicating those jobs here doubled CI time for no extra coverage.
  # This workflow now only fires for tag releases and manual builds.
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint:
    uses: ./.github/workflows/reusable-format-lint.yml

  python-test:
    uses: ./.github/workflows/reusable-python-test.yml

  ts-test:
    uses: ./.github/workflows/reusable-ts-test.yml

  package:
    needs: [lint, python-test, ts-test]
    uses: ./.github/workflows/reusable-package-build.yml

  release:
    name: Upload Release Assets
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          disk-cache: true
          repository-cache: true
      - name: "Verify tag matches VERSION"
        run: bazel run //tools/version_synch:sync_version -- --check-tag "${{ github.ref_name }}"
      - name: "Download vsix artifact"
        uses: actions/download-artifact@v8
        with:
          name: package
      - name: "Download wheel artifact"
        uses: actions/download-artifact@v8
        with:
          name: lsp-wheel
      - name: "Download lsp4ij-template artifact"
        uses: actions/download-artifact@v8
        with:
          name: lsp4ij-template
      - name: "Upload release assets"
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.vsix
            trlc_lsp*.whl
            lsp4ij-template.zip
