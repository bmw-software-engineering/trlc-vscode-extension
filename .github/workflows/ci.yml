name: TRLC Extension CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:

  lint:
    uses: ./.github/workflows/reusable-format-lint.yml

  python-test:
    uses: ./.github/workflows/reusable-python-test.yml

  ts-test:
    uses: ./.github/workflows/reusable-ts-test.yml

  e2e-test:
    uses: ./.github/workflows/reusable-e2e-test.yml

  # Verifies the actual vsce package / wheel build steps succeed on every
  # PR - reusable-e2e-test.yml only assembles an unzipped equivalent
  # (extension_bundle + vsix_static_files, missing //docs/assets) and never
  # exercises `bazel build //:wheel` at all, so packaging regressions were
  # previously caught only at tag-push release time (build.yml).
  package:
    needs: [lint, python-test, ts-test]
    uses: ./.github/workflows/reusable-package-build.yml

  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          disk-cache: true
          repository-cache: true
      - name: Verify Version
        run: bazel run //tools/version_synch:sync_version -- --check
