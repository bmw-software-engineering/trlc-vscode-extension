name: Reusable - Format & Lint

on:
  workflow_call:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      ASPECT_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          disk-cache: true
          repository-cache: true
      - name: Copyright check
        run: bazel run //:copyright-check
      - name: Format check
        run: bazel run //tools/format:format.check
      - name: Lint
        run: bazel build --config=lint //src/server/... //tests/... //tools/version_synch/... //:extension_ts
      - name: Requirements lock drift (all versions)
        run: bazel test //:requirements_dev_3_10.test //:requirements_dev_3_11.test //:requirements_dev_3_12.test //:requirements_dev_3_13.test --test_output=errors
