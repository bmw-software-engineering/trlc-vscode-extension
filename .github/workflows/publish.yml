name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g. v3.3.0) - must already exist as a GitHub Release"
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Rebuild from tag
    runs-on: ubuntu-latest
    env:
      ASPECT_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          disk-cache: true
          repository-cache: true
      - name: "Verify tag matches VERSION"
        run: bazel run //tools/version_synch:sync_version -- --check-tag "${{ inputs.tag }}"
      - name: "Build vsix and wheel"
        run: |
          bazel build //:vsix //:wheel
          cp bazel-bin/trlc-vscode-extension.vsix .
          cp bazel-bin/src/server/trlc_lsp-*.whl .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-vsix
          path: "*.vsix"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-wheel
          path: "trlc_lsp*.whl"

  publish-vscode-marketplace:
    name: Publish to VS Code Marketplace
    needs: build
    runs-on: ubuntu-latest
    # Required reviewer(s) configured on this environment are the actual
    # "confirm before this irreversible action" gate - see
    # docs/RELEASE_AND_DEPLOYMENT.md's one-time setup checklist.
    environment: marketplace-publish
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-vsix
      - name: "Publish to Marketplace"
        run: npx @vscode/vsce publish --packagePath *.vsix -p "${{ secrets.VSCE_PAT }}"

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write # OIDC trusted publishing - no stored secret
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publish-wheel
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
